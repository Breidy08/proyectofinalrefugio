<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Refugio Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Sistema de Refugio de Animales</span>
        </div>
    </nav>
    <div class="container">
        
        <!-- REGISTRO Y ÁRBOL -->
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm mb-4">
                    <h4>Registrar Animal</h4>
                    <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre">
                    <input type="text" id="especie" class="form-control mb-2" placeholder="Especie">
                    <input type="number" id="edad" class="form-control mb-3" placeholder="Edad (meses)">
                    <button class="btn btn-primary w-100" onclick="registrarAnimal()">Guardar en Hash y Árbol</button>
                </div>
                
                <div class="card p-3 shadow-sm border-warning mb-4">
                    <h5 class="text-warning">Búsqueda O(1) (Hash)</h5>
                    <div class="d-flex">
                        <input type="number" id="buscarId" class="form-control me-2" placeholder="ID Animal">
                        <button class="btn btn-warning" onclick="buscarAnimal()">Buscar</button>
                    </div>
                    <div id="resultadoBusqueda" class="mt-3 text-success fw-bold"></div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="d-flex justify-content-between mb-2">
                    <h5>Inventario</h5>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary me-2" onclick="cargarAnimales()">Original (Hash)</button>
                        <button class="btn btn-sm btn-success" onclick="cargarPorEdad()">Ordenar por Edad (Árbol BST)</button>
                    </div>
                </div>
                <table class="table table-striped table-hover bg-white shadow-sm">
                    <thead><tr><th>ID</th><th>Nombre</th><th>Especie</th><th>Edad</th></tr></thead>
                    <tbody id="tablaAnimales"></tbody>
                </table>
            </div>
        </div>

        <div class="row mt-3 mb-5">
            <!-- COLA MÉDICA -->
            <div class="col-md-6">
                <div class="card p-3 shadow-sm border-info h-100">
                    <h4 class="text-info">Agenda Médica (Cola FIFO)</h4>
                    <input type="text" id="nombrePaciente" class="form-control mb-2" placeholder="Nombre">
                    <input type="text" id="motivoConsulta" class="form-control mb-3" placeholder="Motivo">
                    <div class="d-flex gap-2">
                        <button class="btn btn-info w-100 text-white" onclick="encolarPaciente()">Formar</button>
                        <button class="btn btn-success w-100" onclick="atenderSiguiente()">Atender Siguiente</button>
                    </div>
                    <ul id="listaAgenda" class="list-group mt-3 shadow-sm"></ul>
                </div>
            </div>

            <!-- GRAFO DE ADOPCIONES -->
            <div class="col-md-6">
                <div class="card p-3 shadow-sm border-danger h-100">
                    <h4 class="text-danger">Afinidad (Grafo Red)</h4>
                    <div class="d-flex gap-2 mb-2">
                        <input type="number" id="g_id1" class="form-control" placeholder="ID 1">
                        <input type="number" id="g_id2" class="form-control" placeholder="ID 2">
                        <input type="number" id="g_afinidad" class="form-control" placeholder="Afinidad (1-10)">
                    </div>
                    <button class="btn btn-danger w-100 mb-3" onclick="conectarGrafo()">Crear Arista (Conectar)</button>
                    
                    <div class="input-group">
                        <input type="number" id="g_buscar" class="form-control" placeholder="Ver compatibles de ID...">
                        <button class="btn btn-outline-danger" onclick="verConexiones()">Ver Red</button>
                    </div>
                    <ul id="listaGrafo" class="list-group mt-3 shadow-sm"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Funciones Hash y Arbol
        async function cargarAnimales() {
            const res = await fetch('/api/animales');
            renderTabla(await res.json());
        }
        async function cargarPorEdad() {
            const res = await fetch('/api/edades');
            renderTabla(await res.json());
        }
        function renderTabla(data) {
            const t = document.getElementById('tablaAnimales');
            t.innerHTML = ''; 
            data.forEach(a => t.innerHTML += `<tr><td>${a.id}</td><td>${a.nombre}</td><td>${a.especie}</td><td>${a.edad} meses</td></tr>`);
        }
        async function registrarAnimal() {
            const n = document.getElementById('nombre').value, e = document.getElementById('especie').value, ed = document.getElementById('edad').value;
            if(!n || !e || !ed) return;
            await fetch('/api/registrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre:n, especie:e, edad: parseInt(ed) }) });
            cargarAnimales();
        }
        async function buscarAnimal() {
            const id = document.getElementById('buscarId').value;
            if(!id) return;
            const res = await fetch(`/api/buscar/${id}`);
            document.getElementById('resultadoBusqueda').innerHTML = res.ok ? 
                `¡Encontrado! ${(await res.json()).nombre}` : `<span class="text-danger">No existe</span>`;
        }

        // Funciones Cola
        async function cargarAgenda() {
            const res = await fetch('/api/agenda');
            const citas = await res.json();
            const l = document.getElementById('listaAgenda'); l.innerHTML = ''; 
            if(citas.length === 0) return l.innerHTML = '<li class="list-group-item text-muted">Cola vacía.</li>';
            citas.forEach((c, i) => l.innerHTML += `<li class="list-group-item ${i===0?'list-group-item-success':''}">${i+1}. ${c.nombre} - ${c.motivo}</li>`);
        }
        async function encolarPaciente() {
            const n = document.getElementById('nombrePaciente').value, m = document.getElementById('motivoConsulta').value;
            if(!n || !m) return;
            await fetch('/api/encolar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre:n, motivo:m }) });
            cargarAgenda();
        }
        async function atenderSiguiente() { await fetch('/api/atender', { method: 'POST' }); cargarAgenda(); }

        // Funciones Grafo
        async function conectarGrafo() {
            const id1 = document.getElementById('g_id1').value, id2 = document.getElementById('g_id2').value, afi = document.getElementById('g_afinidad').value;
            if(!id1 || !id2 || !afi) return;
            await fetch('/api/grafo/conectar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id1: parseInt(id1), id2: parseInt(id2), afinidad: parseInt(afi) }) });
            document.getElementById('g_buscar').value = id1; verConexiones();
        }
        async function verConexiones() {
            const id = document.getElementById('g_buscar').value;
            if(!id) return;
            const res = await fetch(`/api/grafo/${id}`);
            const redes = await res.json();
            const l = document.getElementById('listaGrafo'); l.innerHTML = '';
            if(redes.length === 0) return l.innerHTML = '<li class="list-group-item text-muted">Sin conexiones.</li>';
            redes.forEach(r => l.innerHTML += `<li class="list-group-item d-flex justify-content-between"><span>ID ${r.id} - ${r.nombre}</span> <span class="badge bg-danger rounded-pill">Afinidad ${r.afinidad}</span></li>`);
        }

        cargarAnimales(); cargarAgenda();
    </script>
</body>
</html>
